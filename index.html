<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Urna Eletrônica</title>
</head>
<body>
    <header>
       <h2>Eleições Dev</h1>
       <nav class=" nav-tab">
            <button id="bt-heroi" class="tab">HERÓI DO ANO</button>
            <button id="bt-vilao" class="tab">VILÃO DO ANO</button>
            <button id="bt-resultado" class="tab">RESULTADO URNA</button>
            <button id="bt-nova-votacao" class="tab">NOVA VOTAÇÃO</button>
       </nav>
    </header>
    
    <div class="conteiner">

        <div class="espaco-vazio">
            <section class="aria-personagens">

                <ul id="lista-personagens">

                </ul>
            </section>

             <section id="resultado" class="resultado">
                    <div id="resultadosTela">

                    </div>
                    <div id="resultadoBrancosNulos">

                    </div>
             </section>

        </div>
        <main>
            <div class="urna-eletronica">
                <section class="tela-inicial">
                    <div class="text-voto">
                        <span>Seu voto para </span>
                    </div>
                    <h2 class="cargo">Herói do Ano</h2>
                    <figure class="cartao-perfil">
                        <div class="foto-perfil">
                            <img id="foto-candidato" src="" alt="Foto de perfil">
                        </div>
            
                        <figcaption>
                            <h1 class="nome">
                                <span id="nome-candidato"></span>
                            </h1>
                            <div class="numero">
                                <label id="textN">Nº</label>  
                                <input id="numero-candidato" 
                                type="text"  maxlength="2"
                                readonly
                                />
                                <div id="visor" class="visor"></div>
                                <!--  readonly: não digitando no teclado físico -->
                            </div>
                        </figcaption>
                    </figure>
                
                    <div class="mensagem">
                        Aperte a tela:<br/>
                        CONFIRMA para CONFIRMAR este voto<br/>
                        CORRIGE para REINICIAR este voto
                    </div>

                </section>

                <section class="area-teclado">
                    <h2 id="tecaldo" class="text-teclado">TECLADO DE VOTAÇÃO</h2>
                    <div>
                        <div class="teclado">
                            <button type="button" class="botao" value="1">1</button>
                            <button type="button" class="botao" value="2">2</button>
                            <button type="button" class="botao" value="3">3</button>
                            <button type="button" class="botao" value="4">4</button>
                            <button type="button" class="botao" value="5">5</button>
                            <button type="button" class="botao" value="6">6</button>
                            <button type="button" class="botao" value="7">7</button>
                            <button type="button" class="botao" value="8">8</button>
                            <button type="button" class="botao" value="9">9</button>
                            <button id="botao-0" type="button" class="botao" value="0">0</button>
                        </div>

                        <div class="ações">
                            <button type="button" class="botao-corrigir" >CORRIGIR</button>
                            <button type="button" class="botao-branco" >BRANCO</button>
                        </div>

                        <button type="button" class="botao-confirmar" >CONFIRMAR</button>   
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="./candidato.js"></script>
    <script src="./personagens.js"></script>
    <script src="./script.js"></script>
</body>
</html>
